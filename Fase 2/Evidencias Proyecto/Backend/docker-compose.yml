version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: django_postgres_db
    restart: always
    environment:
      POSTGRES_DB: CogniStockDB
      POSTGRES_USER: cognistock_admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
